services:
  db:
    image: postgres:16-alpine
    container_name: mango_db
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    volumes:
      - mango_pg:/var/lib/postgresql/data
    networks:
      - mango_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mango_redis
    volumes:
      - mango_redis:/data
    networks:
      - mango_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-shot init: crea tablas y sale
  db_init:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: mango-backend:local
    container_name: mango_db_init
    environment:
      DATABASE_URL: "postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      DB_WAIT_S: "${DB_WAIT_S:-90}"
    networks:
      - mango_net
    depends_on:
      db:
        condition: service_healthy
    # clave: override del entrypoint para que NO arranque gunicorn
    entrypoint: ["python", "db_init.py"]
    restart: "no"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: mango-backend:local
    container_name: mango_backend
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "5000"
      DATABASE_URL: "postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "${SECRET_KEY}"

      # opcional auth (Lovable)
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
      AUTH_DISABLED: "${AUTH_DISABLED:-0}"

      # Jetson TK1 — acceso via reverse SSH tunnel (puerto 9200 en localhost)
      JETSON_HOST: "${JETSON_HOST:-localhost}"
      JETSON_PORT: "${JETSON_PORT:-9200}"
      JETSON_USER: "${JETSON_USER:-ubuntu}"
      JETSON_SSH_KEY_PATH: "/run/secrets/jetson_key"
    volumes:
      - /home/mango/.ssh/id_ed25519:/run/secrets/jetson_key:ro
    networks:
      - mango_net
    depends_on:
      db_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Backend solo interno (localhost):
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 25s
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: mango_grafana
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-mangoGrafana2025}"
      # Allow embedding panels in iframes (removes X-Frame-Options: deny)
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Anonymous viewer access — required for embedded panels to render without login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      # Disable signups and public profiles (keep admin access secure)
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: "warn"
      # Passed to provisioning datasource template
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - mango_net
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  mango_pg:
  mango_redis:
  grafana_data:

networks:
  mango_net:
    name: mango_net
    external: true