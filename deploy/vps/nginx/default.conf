# M.A.N.G.O — Nginx host config (VPS, Debian 12)
# Copy to /etc/nginx/sites-available/integramosoe
# Symlink: sudo ln -sf /etc/nginx/sites-available/integramosoe /etc/nginx/sites-enabled/integramosoe
#
# Protocol routing:
#   /api/v1/stream        — SSE (no buffering, 3600s timeout)
#   /api/v1/ingest*       — POST from edge nodes (ingest + batch)
#   /api/                 — all other API routes (auth, readings, devices, sync, alerts)
#   /grafana/             — Grafana embedded viewer
#   /                     — SPA (React/Vite, index.html fallback)

server {
    listen 80;
    server_name integramosoe.com www.integramosoe.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name integramosoe.com www.integramosoe.com;

    ssl_certificate     /etc/letsencrypt/live/integramosoe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/integramosoe.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/mango-ui;
    index index.html;

    access_log /var/log/nginx/mango_access.log;
    error_log  /var/log/nginx/mango_error.log warn;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"              always;
    add_header X-Content-Type-Options "nosniff"                 always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection       "1; mode=block"           always;

    # -----------------------------------------------------------------------
    # SSE real-time stream — exact match before /api/ prefix block.
    # No proxy buffering; long timeout keeps the stream alive across proxies.
    # -----------------------------------------------------------------------
    location = /api/v1/stream {
        proxy_pass              http://127.0.0.1:8000;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection        "";
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600s;
        proxy_connect_timeout   5s;
        chunked_transfer_encoding on;
    }

    # -----------------------------------------------------------------------
    # Ingest endpoints — slightly relaxed body size for batch uploads.
    # Edge nodes POST here with INGEST_API_KEY in X-Api-Key header.
    #   POST /api/v1/ingest          (single packet)
    #   POST /api/v1/ingest/batch    (store-and-forward replay, up to 500 pkts)
    # -----------------------------------------------------------------------
    location ~ ^/api/v1/ingest {
        client_max_body_size  4m;
        proxy_pass            http://127.0.0.1:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
    }

    # -----------------------------------------------------------------------
    # Admin file upload — large body, extended write timeout.
    # Must appear before the generic /api/ prefix block.
    # -----------------------------------------------------------------------
    location = /api/v1/admin/upload {
        client_max_body_size  512m;
        proxy_pass            http://127.0.0.1:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;
    }

    # -----------------------------------------------------------------------
    # All remaining API routes
    #   /api/v1/readings/*   /api/v1/sensors/*
    #   /api/v1/devices/*    /api/v1/sync/*
    #   /api/v1/alerts/*     /api/v1/users/*
    #   /api/v1/health       /api/v1/version  /api/v1/status
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass            http://127.0.0.1:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
    }

    # -----------------------------------------------------------------------
    # Grafana embedded viewer
    # ^~ stops regex locations from stealing Grafana static assets.
    # No trailing slash on proxy_pass: Grafana expects the full /grafana/ prefix
    # because GF_SERVER_SERVE_FROM_SUB_PATH=true.
    # -----------------------------------------------------------------------
    location ^~ /grafana/ {
        proxy_pass            http://127.0.0.1:3000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_hide_header     X-Frame-Options;
        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;
    }

    # -----------------------------------------------------------------------
    # Protocolo Legal: documentación retirada de la superficie pública.
    # /docs/* devuelve 404 (los archivos ya no se despliegan en el webroot).
    # -----------------------------------------------------------------------
    location ^~ /docs/ {
        return 404;
    }

    # -----------------------------------------------------------------------
    # SPA fallback (React/Vite)
    # All frontend routes resolve to index.html; the SPA router handles them.
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        expires   1h;
        add_header Cache-Control "public, no-transform";
    }

    # Static assets with long cache (Vite appends content hashes to filenames)
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }
}
