# M.A.N.G.O — Nginx host config (VPS, Debian 12)
# Copia este archivo a /etc/nginx/sites-available/integramosoe
# y haz el symlink: sudo ln -sf ... /etc/nginx/sites-enabled/integramosoe

server {
    listen 80;
    server_name integramosoe.com www.integramosoe.com;

    # Redirect HTTP → HTTPS (certbot lo actualiza automáticamente)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name integramosoe.com www.integramosoe.com;

    # Certbot coloca estos paths automáticamente con --nginx
    ssl_certificate     /etc/letsencrypt/live/integramosoe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/integramosoe.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/mango-ui;
    index index.html;

    # Logs
    access_log /var/log/nginx/mango_access.log;
    error_log  /var/log/nginx/mango_error.log warn;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # API → backend docker (escucha en 127.0.0.1:8000)
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Grafana → contenedor Docker (escucha en 127.0.0.1:3000)
    location /grafana/ {
        proxy_pass            http://127.0.0.1:3000/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_hide_header     X-Frame-Options;
        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;
    }

    # SPA fallback (React/Vite — todas las rutas van a index.html)
    location / {
        try_files $uri $uri/ /index.html;
        expires   1h;
        add_header Cache-Control "public, no-transform";
    }

    # Assets con cache largo (Vite genera hashes en los nombres)
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }
}