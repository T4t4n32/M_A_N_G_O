# M.A.N.G.O — Nginx host config (VPS, Debian 12)
# Copy to /etc/nginx/sites-available/integramosoe
# Symlink: sudo ln -sf /etc/nginx/sites-available/integramosoe /etc/nginx/sites-enabled/integramosoe
#
# Protocol routing:
#   /api/v1/stream               — SSE (no buffering, 3600s timeout)
#   /api/v1/admin/terminal/*     — WebSocket PTY terminals (upgrade headers, long timeout)
#   /api/v1/ingest*              — POST from edge nodes
#   /api/                        — all other API routes
#   /grafana/                    — Grafana embedded viewer
#   /                            — SPA (React/Vite, index.html fallback)

server {
    listen 80;
    server_name integramosoe.com www.integramosoe.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name integramosoe.com www.integramosoe.com;

    ssl_certificate     /etc/letsencrypt/live/integramosoe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/integramosoe.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/mango-ui;
    index index.html;

    access_log /var/log/nginx/mango_access.log;
    error_log  /var/log/nginx/mango_error.log warn;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"              always;
    add_header X-Content-Type-Options "nosniff"                 always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection       "1; mode=block"           always;

    # -----------------------------------------------------------------------
    # SSE real-time stream
    # -----------------------------------------------------------------------
    location = /api/v1/stream {
        proxy_pass              http://127.0.0.1:8000;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection        "";
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600s;
        proxy_connect_timeout   5s;
        chunked_transfer_encoding on;
    }

    # -----------------------------------------------------------------------
    # WebSocket terminal endpoints — must be before the generic /api/ block.
    # Long timeouts keep the PTY session alive; Upgrade header enables WS.
    # -----------------------------------------------------------------------
    location ~ ^/api/v1/admin/terminal/ {
        proxy_pass              http://127.0.0.1:8000;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
        proxy_connect_timeout   10s;
    }

    # -----------------------------------------------------------------------
    # Ingest endpoints
    # -----------------------------------------------------------------------
    location ~ ^/api/v1/ingest {
        client_max_body_size  4m;
        proxy_pass            http://127.0.0.1:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
    }

    # -----------------------------------------------------------------------
    # All remaining API routes
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass            http://127.0.0.1:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
    }

    # -----------------------------------------------------------------------
    # Grafana embedded viewer
    # -----------------------------------------------------------------------
    location ^~ /grafana/ {
        proxy_pass            http://127.0.0.1:3000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_hide_header     X-Frame-Options;
        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;
    }

    # -----------------------------------------------------------------------
    # SPA fallback (React/Vite)
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        expires   1h;
        add_header Cache-Control "public, no-transform";
    }

    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }
}
