# M.A.N.G.O — Nginx host config (VPS, Debian 12)
# Copy to /etc/nginx/sites-available/integramosoe
# Symlink: sudo ln -sf /etc/nginx/sites-available/integramosoe /etc/nginx/sites-enabled/integramosoe
#
# Protocol routing:
#   /api/v1/stream               — SSE (no buffering, 3600s timeout)
#   /api/v1/admin/terminal/*     — WebSocket PTY terminals (upgrade headers, long timeout)
#   /api/v1/uploads/             — serve uploaded files directly from disk (no backend)
#   /api/v1/admin/upload         — POST upload endpoint (2 GB body, no buffering)
#   /api/v1/ingest*              — POST from edge nodes
#   /api/                        — all other API routes
#   /grafana/                    — Grafana embedded viewer
#   /                            — SPA (React/Vite, index.html fallback)

# ── Keepalive pool to gunicorn ────────────────────────────────────────────────
# Reuses TCP connections instead of creating a new one per request.
# Requires proxy_http_version 1.1 + proxy_set_header Connection "" in each block.
upstream mango_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name integramosoe.com www.integramosoe.com;

    # Allow certbot ACME challenge without redirect
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name integramosoe.com www.integramosoe.com;

    ssl_certificate     /etc/letsencrypt/live/integramosoe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/integramosoe.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # SSL session reuse — avoids full TLS handshake on repeat connections.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling — server pre-fetches cert validity so clients don't have to.
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # Explicit ECDH curves fix TLS 1.3 "bad key share" failures on some clients.
    # X25519 covers all modern browsers; P-256/P-384 cover older Android/iOS.
    ssl_ecdh_curve      X25519:prime256v1:secp384r1;

    root  /var/www/mango-ui;
    index index.html;

    access_log /var/log/nginx/mango_access.log;
    error_log  /var/log/nginx/mango_error.log warn;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                              always;
    add_header X-Content-Type-Options    "nosniff"                                 always;
    add_header Referrer-Policy           "no-referrer-when-downgrade"              always;
    add_header X-XSS-Protection          "1; mode=block"                           always;
    # HSTS: browsers use HTTPS exclusively for 2 years after first visit.
    # This eliminates the HTTP→HTTPS redirect latency on return visits and
    # prevents SSL-stripping attacks.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains"     always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Shared proxy headers (inherited by all location blocks) ───────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── SSE real-time stream ──────────────────────────────────────────────────
    # Exact match must appear before the /api/ prefix block.
    # Buffering disabled; Connection "" prevents upstream keepalive confusion.
    location = /api/v1/stream {
        proxy_pass              http://mango_backend;
        proxy_http_version      1.1;
        proxy_set_header        Connection        "";
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600s;
        proxy_connect_timeout   5s;
        chunked_transfer_encoding on;
    }

    # ── WebSocket terminal endpoints ──────────────────────────────────────────
    # Must appear before the generic /api/ prefix block.
    location ~ ^/api/v1/admin/terminal/ {
        proxy_pass              http://mango_backend;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
        proxy_connect_timeout   10s;
    }

    # ── Uploaded-file serving ─────────────────────────────────────────────────
    # Served directly by nginx from the bind-mounted uploads directory.
    # No Python/Gunicorn involved: zero worker overhead, full Range/seek support.
    location ^~ /api/v1/uploads/ {
        alias   /var/www/mango-uploads/;

        sendfile    on;
        tcp_nopush  on;
        tcp_nodelay on;

        add_header  Accept-Ranges bytes;
        expires     7d;
        add_header  Cache-Control "public, no-transform";
        autoindex   off;
        try_files   $uri =404;
    }

    # ── File upload endpoint ──────────────────────────────────────────────────
    # Large body, long timeout, no request buffering.
    # Must appear before the generic /api/ prefix block.
    location = /api/v1/admin/upload {
        client_max_body_size    2g;
        proxy_pass              http://mango_backend;
        proxy_http_version      1.1;
        proxy_set_header        Connection        "";
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
        proxy_connect_timeout   10s;
        proxy_request_buffering off;
    }

    # ── Ingest endpoints ──────────────────────────────────────────────────────
    # Edge nodes POST here with INGEST_API_KEY in X-Api-Key header.
    location ~ ^/api/v1/ingest {
        client_max_body_size  4m;
        proxy_pass            http://mango_backend;
        proxy_http_version    1.1;
        proxy_set_header      Connection        "";
        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;
    }

    # ── All remaining API routes ──────────────────────────────────────────────
    # Large proxy buffers keep responses (e.g. paginated media JSON) in memory
    # instead of being written to disk, which caused heavy I/O under load.
    location /api/ {
        proxy_pass              http://mango_backend;
        proxy_http_version      1.1;
        proxy_set_header        Connection        "";
        proxy_read_timeout      30s;
        proxy_connect_timeout   5s;
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }

    # ── Grafana embedded viewer ───────────────────────────────────────────────
    # ^~ stops regex locations from stealing Grafana static assets.
    location ^~ /grafana/ {
        proxy_pass            http://127.0.0.1:3000;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_hide_header     X-Frame-Options;
        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;
    }

    # ── SPA fallback (React/Vite) ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        expires   1h;
        add_header Cache-Control "public, no-transform";
    }

    # Static assets with long cache (Vite appends content hashes to filenames)
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }
}
