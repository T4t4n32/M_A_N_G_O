description "MANGO reverse SSH tunnel to VPS"

start on (filesystem and net-device-up)
stop on runlevel [!2345]

respawn
respawn limit 10 5

setuid ubuntu
setgid ubuntu

script
    exec ssh -N \
        -o StrictHostKeyChecking=no \
        -o ServerAliveInterval=30 \
        -o ServerAliveCountMax=3 \
        -o ConnectTimeout=30 \
        -o ExitOnForwardFailure=yes \
        -i /home/ubuntu/.ssh/id_rsa_tunnel \
        -R 9200:localhost:22 \
        mango@integramosoe.com \
        -p 5972
end script
