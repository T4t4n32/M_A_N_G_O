description "MANGO reverse SSH tunnel to VPS"

start on (filesystem and net-device-up)
stop on runlevel [!2345]

respawn
respawn limit 10 5

setuid ubuntu
setgid ubuntu

script
    set -a
    [ -f /opt/mango_node/.env ] && . /opt/mango_node/.env
    set +a

    if [ -z "$MANGO_VPS_HOST" ]; then
        logger -t mango-tunnel "MANGO_VPS_HOST not set — tunnel disabled"
        exit 0
    fi

    exec ssh -N \
        -o StrictHostKeyChecking=no \
        -o ServerAliveInterval=30 \
        -o ServerAliveCountMax=3 \
        -o ConnectTimeout=30 \
        -o ExitOnForwardFailure=yes \
        -i "${MANGO_SSH_KEY:-/home/mango/.ssh/id_rsa_tunnel}" \
        -R "${MANGO_TUNNEL_RPORT:-9200}:localhost:22" \
        "${MANGO_VPS_USER:-mango}@${MANGO_VPS_HOST}" \
        -p "${MANGO_VPS_SSH_PORT:-22}"
end script
