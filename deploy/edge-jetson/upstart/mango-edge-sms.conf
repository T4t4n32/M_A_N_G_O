description "MANGO Edge - SMS alert dispatcher (Huawei E3372H-153)"

start on (started mango-edge-serial and net-device-up)
stop on stopping mango-edge-serial

respawn
respawn limit 10 5

setuid mango
setgid mango

chdir /opt

script
    set -a
    [ -f /opt/mango_node/.env ] && . /opt/mango_node/.env
    set +a
    export PYTHONUNBUFFERED=1
    export PYTHONPATH=/opt
    exec /usr/bin/python3 -m mango_node.sms_dispatch
end script
