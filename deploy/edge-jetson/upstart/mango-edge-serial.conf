description "MANGO Edge - serial acquisition (ESP32 -> SQLite)"

start on (filesystem and net-device-up IFACE=lo)
stop on runlevel [!2345]

respawn
respawn limit 10 5

setuid mango
setgid mango

chdir /opt/mango_node

script
    set -a
    [ -f /opt/mango_node/.env ] && . /opt/mango_node/.env
    set +a
    export PYTHONUNBUFFERED=1
    exec /usr/bin/python3 -m mango_node.serial_acquire
end script
