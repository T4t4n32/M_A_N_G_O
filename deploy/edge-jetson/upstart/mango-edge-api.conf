description "MANGO Edge - local dashboard API (port 9100)"

start on filesystem
stop on runlevel [!2345]

respawn
respawn limit 10 5

setuid ubuntu
setgid ubuntu

chdir /opt

script
    set -a
    [ -f /opt/mango_node/.env ] && . /opt/mango_node/.env
    set +a
    export PYTHONUNBUFFERED=1
    export PYTHONPATH=/opt
    exec /usr/bin/python3 -m mango_node.local_api
end script
