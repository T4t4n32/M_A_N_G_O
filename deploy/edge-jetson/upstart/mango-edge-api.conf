description "MANGO Edge — local Flask API (port 9100)"

start on filesystem
stop on runlevel [!2345]

respawn
respawn limit 10 5

setuid ubuntu
setgid ubuntu

script
    set -a
    [ -f /opt/mango/.env ] && . /opt/mango/.env
    set +a
    export PYTHONUNBUFFERED=1
    export PYTHONPATH=/opt/mango/edge
    exec /usr/bin/python3 /opt/mango/edge/run_api.py
end script
