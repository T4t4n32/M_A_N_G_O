description "MANGO Edge — mission state machine"

start on (started mango-edge-api)
stop on stopping mango-edge-api

respawn
respawn limit 10 5

setuid ubuntu
setgid ubuntu

script
    set -a
    [ -f /opt/mango/.env ] && . /opt/mango/.env
    set +a
    export PYTHONUNBUFFERED=1
    export PYTHONPATH=/opt/mango/edge
    exec /usr/bin/python3 /opt/mango/edge/run_mission.py
end script
