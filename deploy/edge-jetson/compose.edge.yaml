# M.A.N.G.O. — Jetson edge stack
#
# NOTE: Docker is not officially supported on the Jetson TK1 (Ubuntu 14/16,
# ARM32).  This file is provided for future hardware that supports Docker
# (Jetson Nano / Xavier / Orin).  On the TK1, use the systemd services
# under deploy/edge-jetson/systemd/ instead.
#
# Usage (on compatible hardware):
#   cp .env.edge.example .env
#   docker compose -f compose.edge.yaml up -d
#
# Services:
#   edge-serial   — reads ESP32 UART; writes to local SQLite outbox
#   edge-sync     — flushes outbox to VPS via /api/v1/ingest/batch
#   edge-sms      — sends SMS alerts via Huawei LTE modem
#   edge-local-api — exposes local read-only HTTP API on port 9100

services:
  edge-serial:
    image: python:3.11-slim
    container_name: mango_edge_serial
    working_dir: /opt/mango_node
    volumes:
      - /opt/mango_node:/opt/mango_node:ro
      - mango_edge_data:/data
    devices:
      - "${MANGO_SERIAL_PORT:-/dev/ttyUSB0}:${MANGO_SERIAL_PORT:-/dev/ttyUSB0}"
    env_file: .env
    environment:
      MANGO_DB_PATH: /data/mango_node.db
    command: ["python3", "-m", "mango_node.serial_acquire"]
    restart: unless-stopped

  edge-sync:
    image: python:3.11-slim
    container_name: mango_edge_sync
    working_dir: /opt/mango_node
    volumes:
      - /opt/mango_node:/opt/mango_node:ro
      - mango_edge_data:/data
    env_file: .env
    environment:
      MANGO_DB_PATH: /data/mango_node.db
    command: ["python3", "-m", "mango_node.sync_manager"]
    depends_on:
      - edge-serial
    restart: unless-stopped

  edge-sms:
    image: python:3.11-slim
    container_name: mango_edge_sms
    working_dir: /opt/mango_node
    volumes:
      - /opt/mango_node:/opt/mango_node:ro
      - mango_edge_data:/data
    # The Huawei modem gateway (192.168.8.1) is on the host network.
    network_mode: host
    env_file: .env
    environment:
      MANGO_DB_PATH: /data/mango_node.db
    command: ["python3", "-m", "mango_node.sms_dispatch"]
    depends_on:
      - edge-serial
    restart: unless-stopped

  edge-local-api:
    image: python:3.11-slim
    container_name: mango_edge_local_api
    working_dir: /opt/mango_node
    volumes:
      - /opt/mango_node:/opt/mango_node:ro
      - mango_edge_data:/data
    env_file: .env
    environment:
      MANGO_DB_PATH: /data/mango_node.db
      MANGO_LOCAL_API_PORT: "${MANGO_LOCAL_API_PORT:-9100}"
    ports:
      - "${MANGO_LOCAL_API_PORT:-9100}:${MANGO_LOCAL_API_PORT:-9100}"
    command: ["python3", "-m", "mango_node.local_api"]
    depends_on:
      - edge-serial
    restart: unless-stopped

volumes:
  mango_edge_data:
