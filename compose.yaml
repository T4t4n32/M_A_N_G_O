services:
  db:
    image: postgres:16-alpine
    container_name: mango_db
    environment:
      POSTGRES_DB: mango
      POSTGRES_USER: mango
      POSTGRES_PASSWORD: mango
    volumes:
      - mango_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mango -d mango"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mango_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - mango_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mango-backend:local
    container_name: mango_backend
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg2://mango:mango@db:5432/mango
      REDIS_URL: redis://redis:6379/0
      DEFAULT_STATION_NAME: "MANGO Station"
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "60"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:alpine
    container_name: mango_nginx
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  mango_pg:
  mango_redis:
