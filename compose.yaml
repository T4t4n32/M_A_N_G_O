services:
  db:
    image: postgres:16-alpine
    container_name: mango_db
    environment:
      POSTGRES_USER: mango
      POSTGRES_PASSWORD: mango
      POSTGRES_DB: mango
    volumes:
      - mango_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mango -d mango"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mango_redis
    volumes:
      - mango_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Runs once to create DB tables. It must NOT start gunicorn.
  # IMPORTANT: This uses db_init.py (not init_db.py) because your backend has db_init.py.
  db_init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mango-backend:local
    container_name: mango_db_init
    environment:
      DATABASE_URL: postgresql+psycopg2://mango:mango@db:5432/mango
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-dev-secret
      DB_WAIT_S: "90"
    depends_on:
      db:
        condition: service_healthy
    # Override the Dockerfile ENTRYPOINT (which starts gunicorn)
    entrypoint: ["python", "db_init.py"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mango-backend:local
    container_name: mango_backend
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "5000"
      DATABASE_URL: postgresql+psycopg2://mango:mango@db:5432/mango
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-dev-secret
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "4"
      GUNICORN_TIMEOUT: "60"
      GUNICORN_PRELOAD: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    ports:
      - "8000:5000"
    healthcheck:
      # Your API lives under /api/v1
      #test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/v1/health || curl -fsS http://localhost:5000/api/health || curl -fsS http://localhost:5000/health || exit 1"]
      #test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/v1/health || exit 1"]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mango_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mango_pg:
  mango_redis:
