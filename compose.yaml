services:
  db:
    image: postgres:16-alpine
    container_name: mango_db
    environment:
      POSTGRES_USER: mango
      POSTGRES_PASSWORD: mango
      POSTGRES_DB: mango
    volumes:
      - mango_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mango -d mango"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mango_redis
    volumes:
      - mango_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mango_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://mango:mango@db:5432/mango
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me
      STATION_NAME: "MANGO Station"
      # Gunicorn
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "4"
      GUNICORN_TIMEOUT: "60"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mango_nginx
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped

  bridge:
    profiles: ["bridge"]     # <- SOLO se levanta si ejecutas: docker compose --profile bridge up ...
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: mango_bridge
    environment:
      SERIAL_PORT: /dev/ttyMANGO
      BAUDRATE: "9600"
      READ_TIMEOUT_S: "1.0"
      API_URL: http://backend:5000/api/v1/ingest
      HTTP_TIMEOUT_S: "5.0"
      STATION_NAME: "MANGO Station"
      LOG_LEVEL: INFO
    # OJO: usa tu by-id real (el que ya viste en /dev/serial/by-id/)
    devices:
      - "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0:/dev/ttyMANGO"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mango_pg:
  mango_redis:
