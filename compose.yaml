services:
  db:
    image: postgres:16-alpine
    container_name: mango_db
    environment:
      POSTGRES_USER: "${DB_USER:-mango}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-mango}"
      POSTGRES_DB: "${DB_NAME:-mango}"
    volumes:
      - mango_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mango_redis
    volumes:
      - mango_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Runs ONCE to create DB tables, then exits 0.
  # IMPORTANT: backend/entrypoint.sh ALWAYS starts gunicorn and ignores args,
  # so db_init MUST override the ENTRYPOINT to run python db_init.py.
  db_init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mango-backend:local
    container_name: mango_db_init
    environment:
      DATABASE_URL: "postgresql+psycopg2://${DB_USER:-mango}:${DB_PASSWORD:-mango}@db:5432/${DB_NAME:-mango}"
      DB_WAIT_S: "${DB_WAIT_S:-90}"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "db_init.py"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mango-backend:local
    container_name: mango_backend
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "5000"
      DATABASE_URL: "postgresql+psycopg2://${DB_USER:-mango}:${DB_PASSWORD:-mango}@db:5432/${DB_NAME:-mango}"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "${SECRET_KEY:-local-dev-secret}"

      # Session security: set to "1" only when served over HTTPS.
      # Local dev stack runs on HTTP so the default here is "0".
      # The VPS .env.vps file sets this to "1" explicitly.
      SESSION_SECURE: "${SESSION_SECURE:-0}"

      # Super-admin: first registration must use this email
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-mangossc@gmail.com}"

      # CORS: comma-separated list of allowed origins
      CORS_ORIGINS: "${CORS_ORIGINS:-https://integramosoe.com,https://www.integramosoe.com,http://localhost:5173,http://localhost:3000,http://localhost:8080}"

      # API key for edge-node ingest endpoints
      INGEST_API_KEY: "${INGEST_API_KEY:-}"
      # Local development only; never enable in production.
      INGEST_ALLOW_ANONYMOUS: "${INGEST_ALLOW_ANONYMOUS:-0}"

      # Optional env-based admin fallback (lovable_auth)
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:-}"
      AUTH_DISABLED: "${AUTH_DISABLED:-0}"

      # SMTP — contact form email delivery
      SMTP_HOST:     "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT:     "${SMTP_PORT:-587}"
      SMTP_USER:     "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      CONTACT_RECIPIENTS: "${CONTACT_RECIPIENTS:-histsoluciones@gmail.com}"

      # Gunicorn tuning
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-4}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-60}"
      GUNICORN_PRELOAD: "${GUNICORN_PRELOAD:-true}"
    depends_on:
      db_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - mango_uploads:/app/uploads
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 25s
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: mango_grafana
    environment:
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:8080/grafana/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-changeme}"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_MODE: "console"
      DB_USER: "${DB_USER:-mango}"
      DB_PASSWORD: "${DB_PASSWORD:-mango}"
      DB_NAME: "${DB_NAME:-mango}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mango_nginx
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - "${UI_DIR:-./frontend/dist}:/usr/share/nginx/html:ro"
    depends_on:
      backend:
        condition: service_healthy
      grafana:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mango_pg:
  mango_redis:
  grafana_data:
  mango_uploads:
