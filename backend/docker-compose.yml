services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: mango_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-mango_local}
      POSTGRES_USER: ${DB_USER:-mango_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_password}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mango_redis
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mango-backend:local
    container_name: mango_backend
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 5000

      DB_NAME: ${DB_NAME:-mango_local}
      DB_USER: ${DB_USER:-mango_user}
      DB_PASSWORD: ${DB_PASSWORD:-local_password}

      DATABASE_URL: postgresql://${DB_USER:-mango_user}:${DB_PASSWORD:-local_password}@postgres:5432/${DB_NAME:-mango_local}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      SECRET_KEY: ${SECRET_KEY:-local-dev-secret}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret}

      FLASK_ENV: ${FLASK_ENV:-development}
      DEBUG: ${DEBUG:-True}

      # Gunicorn (ajustable)
      GUNICORN_APP: ${GUNICORN_APP:-wsgi:app}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-5000}:5000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,socket; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1', int(os.getenv('API_PORT','5000')))); s.close()\""]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mango-backend:local
    container_name: mango_celery_worker
    environment:
      DB_NAME: ${DB_NAME:-mango_local}
      DB_USER: ${DB_USER:-mango_user}
      DB_PASSWORD: ${DB_PASSWORD:-local_password}

      DATABASE_URL: postgresql://${DB_USER:-mango_user}:${DB_PASSWORD:-local_password}@postgres:5432/${DB_NAME:-mango_local}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      SECRET_KEY: ${SECRET_KEY:-local-dev-secret}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret}

      FLASK_ENV: ${FLASK_ENV:-development}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "celery_app:celery", "worker", "-l", "info", "--concurrency=1"]
    init: true
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mango_nginx
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # AJUSTA esta ruta si tus html están en otro lado:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
