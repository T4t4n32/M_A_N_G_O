services:
  backend:
    build: .
    container_name: mango_backend
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis
    volumes:
      - ./data:/app/data

  db:
    image: postgres:16-alpine
    container_name: mango_db
    environment:
      POSTGRES_DB: mango
      POSTGRES_USER: mango
      POSTGRES_PASSWORD: mango
    volumes:
      - mango_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mango_redis

volumes:
  mango_pg:
