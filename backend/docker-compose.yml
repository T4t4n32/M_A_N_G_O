services:
  db:
    image: postgres:16-alpine
    container_name: mango_db
    environment:
      POSTGRES_USER: mango
      POSTGRES_PASSWORD: mango
      POSTGRES_DB: mango
    volumes:
      - mango_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mango -d mango"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mango_redis
    volumes:
      - mango_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mango_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://mango:mango@db:5432/mango
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    container_name: mango_bridge
    depends_on:
      backend:
        condition: service_healthy


  # Tu bridge lo dejas como está si ya lo tienes funcionando; si depende del backend,
  # asegúrate de que use service name "backend" dentro de la red.
  # bridge:
  #   ...

volumes:
  mango_pg:
  mango_redis:
