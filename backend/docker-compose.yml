version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: mango_postgres_local
    environment:
      POSTGRES_DB: mango_local
      POSTGRES_USER: mango_user
      POSTGRES_PASSWORD: local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Si NO tienes este archivo, comenta la línea de abajo:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mango_user -d mango_local"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: mango_redis_local
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mango_backend_local
    env_file:
      - .env.docker
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Ajusta si tu endpoint cambia.
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/latest || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mango_celery_worker_local
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["celery", "-A", "celery_app.celery", "worker", "-l", "info"]
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: mango_pgadmin_local
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
