description "MANGO Node: SMS alert dispatcher via Huawei E3372H-153"

start on (runlevel [2345] and net-device-up IFACE!=lo)
stop on runlevel [016]

respawn
respawn limit 10 5

script
    set -a
    test -f /opt/mango_node/.env && . /opt/mango_node/.env
    cd /opt
    exec /usr/bin/python3 -m mango_node.sms_dispatch
end script

console log
