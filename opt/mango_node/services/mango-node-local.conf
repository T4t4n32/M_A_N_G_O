description "MANGO Node: local HTTP API on port 9100"

start on runlevel [2345]
stop on runlevel [016]

respawn
respawn limit 10 5

pre-start script
    # Stop old service that may hold port 9100
    initctl stop mango-edge-api 2>/dev/null || true
    # Wait briefly for port to release
    sleep 1
end script

script
    set -a
    export PYTHONIOENCODING=utf-8
    export LANG=C.UTF-8
    test -f /opt/mango_node/.env && . /opt/mango_node/.env
    cd /opt
    exec /usr/bin/python3 -m mango_node.local_api
end script

console log
