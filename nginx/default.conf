server {
  listen 80;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  # ─── Security headers ──────────────────────────────────────────────────────
  add_header X-Content-Type-Options  "nosniff"         always;
  add_header X-Frame-Options         "SAMEORIGIN"      always;
  add_header X-XSS-Protection        "1; mode=block"   always;
  add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

  # ─── Shared proxy headers ──────────────────────────────────────────────────
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ─── Admin file upload — 2 GB body, 10-minute timeout ──────────────────────
  location = /api/v1/admin/upload {
    client_max_body_size    2048m;
    proxy_pass              http://backend:5000;
    proxy_read_timeout      600s;
    proxy_send_timeout      600s;
    proxy_connect_timeout   10s;
    proxy_request_buffering off;
  }

  # ─── WebSocket terminal (must come before the generic /api/ block) ─────────
  location ~ ^/api/v1/admin/terminal/ {
    proxy_pass         http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ─── API reverse proxy ──────────────────────────────────────────────────────
  location /api/ {
    proxy_pass            http://backend:5000;
    proxy_read_timeout    60s;
    proxy_connect_timeout 10s;
    client_max_body_size  512m;
  }

  # ─── Grafana sub-path proxy ─────────────────────────────────────────────────
  location /grafana/ {
    proxy_pass         http://grafana:3000/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_hide_header  X-Frame-Options;
  }

  # ─── Static assets — aggressive cache ──────────────────────────────────────
  location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpe?g|webp|avif|gif)$ {
    expires     1y;
    add_header  Cache-Control "public, immutable";
    try_files   $uri =404;
  }

  # ─── SPA fallback ───────────────────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }
}
