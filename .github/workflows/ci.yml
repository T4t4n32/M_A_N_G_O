name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend — lint & import check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mango
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mango_test
        options: >-
          --health-cmd "pg_isready -U mango -d mango_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports and app factory
        env:
          DATABASE_URL: postgresql+psycopg2://mango:test@localhost:5432/mango_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret
        run: |
          python -c "from app import create_app; app = create_app(); print('App factory OK')"

      - name: Run db_init
        env:
          DATABASE_URL: postgresql+psycopg2://mango:test@localhost:5432/mango_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret
          DB_WAIT_S: "30"
        run: python db_init.py

      - name: Run tests (if present)
        env:
          DATABASE_URL: postgresql+psycopg2://mango:test@localhost:5432/mango_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret
        run: |
          if [ -d "../tests" ] && ls ../tests/test_*.py 1>/dev/null 2>&1; then
            pip install pytest
            pytest ../tests/ -v
          else
            echo "No tests found — skipping"
          fi

  frontend:
    name: Frontend — build check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build -- --mode production
