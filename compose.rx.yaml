services:
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    image: mango-bridge:local
    container_name: mango_bridge
    environment:
      SERIAL_PORT: /dev/ttyMANGO
      SERIAL_BAUD: "9600"
      API_URL: http://backend:5000/api/v1/ingest
      STATION_NAME: "MANGO Station"
      SPOOL_FILE: /app/spool.jsonl
      POST_TIMEOUT: "5"
    devices:
      - "${SERIAL_DEVICE:?Set SERIAL_DEVICE before rx-on}:/dev/ttyMANGO"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
