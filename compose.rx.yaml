services:
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    image: mango-bridge:local
    container_name: mango_bridge
    environment:
      SERIAL_PORT: /dev/ttyMANGO
      BAUDRATE: "9600"
      READ_TIMEOUT_S: "1.0"
      API_URL: http://backend:5000/api/v1/ingest
      HTTP_TIMEOUT_S: "5.0"
      STATION_NAME: "MANGO Station"
      LOG_LEVEL: INFO
    devices:
      - "${SERIAL_DEVICE}:/dev/ttyMANGO"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
