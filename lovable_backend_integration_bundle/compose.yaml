services:
  db:
    image: postgres:16-alpine
    container_name: mango_db
    environment:
      POSTGRES_USER: "${DB_USER:-mango}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-mango}"
      POSTGRES_DB: "${DB_NAME:-mango}"
    volumes:
      - mango_pg:/var/lib/postgresql/data
    # Optional: expose to host for debugging
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mango} -d ${DB_NAME:-mango}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mango_redis
    volumes:
      - mango_redis:/data
    # Optional: expose to host for debugging
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Initializes DB schema (runs once) before API
  db_init:
    image: mango-backend:local
    container_name: mango_db_init
    environment:
      DATABASE_URL: "postgresql+psycopg2://${DB_USER:-mango}:${DB_PASSWORD:-mango}@db:5432/${DB_NAME:-mango}"
      DB_WAIT_S: "${DB_WAIT_S:-60}"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "init_db.py"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mango-backend:local
    container_name: mango_backend
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "5000"
      DATABASE_URL: "postgresql+psycopg2://${DB_USER:-mango}:${DB_PASSWORD:-mango}@db:5432/${DB_NAME:-mango}"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "${SECRET_KEY:-local-dev-secret}"
      GUNICORN_APP: "wsgi:app"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-4}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-60}"
      GUNICORN_PRELOAD: "${GUNICORN_PRELOAD:-true}"
    depends_on:
      db_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 25s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mango_nginx
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Serve Lovable build output (dist) by default; override with UI_DIR
      - "${UI_DIR:-./lovable_ui/MANGO_PAGE_LOVABLE_V1.3/dist}:/usr/share/nginx/html:ro"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mango_pg:
  mango_redis:
