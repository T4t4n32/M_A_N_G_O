<!-- =========================
     login.html — M.A.N.G.O
     ========================= -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>M.A.N.G.O — Acceso al Sistema</title>
  <meta name="description" content="Acceso seguro al sistema M.A.N.G.O" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/login.css" />
</head>

<body>

  <div class="container">

    <!-- =========================
         LOGO
         ========================= -->
    <div class="logo">
      <div class="logo-icon">🌊</div>
      <h1 class="logo-title">M.A.N.G.O</h1>
      <p class="logo-subtitle">
        Monitoreo Autónomo de Niveles y Gestión Oceánica
      </p>
    </div>

    <!-- =========================
         CARD
         ========================= -->
    <div class="card">

      <div class="card-header">
        <h2 class="card-title">Acceso al Sistema</h2>
        <p class="card-subtitle">Ingrese sus credenciales</p>
      </div>

      <form id="login-form" novalidate>

        <div class="form-group">
          <label for="user" class="form-label">Usuario</label>
          <input
            type="text"
            id="user"
            class="form-input"
            placeholder="ej: admin"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="pass" class="form-label">Contraseña</label>
          <input
            type="password"
            id="pass"
            class="form-input"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            id="toggle-password"
            class="toggle-password"
            aria-label="Mostrar u ocultar contraseña"
          >
            👁️
          </button>
        </div>

        <div class="remember-me">
          <input
            type="checkbox"
            id="remember"
            class="remember-checkbox"
            checked
          />
          <label for="remember" class="remember-label">
            Recordar sesión en este dispositivo
          </label>
        </div>

        <!-- ERROR -->
        <div id="error-container" style="display:none;">
          <div class="error-message">
            <span>⚠</span>
            <span id="error-text">
              Credenciales inválidas.
            </span>
          </div>
        </div>

        <!-- OFFLINE -->
        <div id="offline-warning" style="display:none;">
          <div class="warning-message">
            <span>🌐</span>
            <span>
              Backend no disponible. Intentando conexión.
            </span>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">
          <span id="btn-text">Ingresar al dashboard</span>
        </button>

      </form>

      <!-- =========================
           STATUS
           ========================= -->
      <div class="system-status">
        <div class="status-online" id="status-indicator">
          <span class="status-indicator" id="connection-indicator"></span>
          <span id="connection-status">Verificando conexión...</span>
        </div>
      </div>

    </div>

    <!-- =========================
         FOOTER
         ========================= -->
    <div class="footer">
      <p>
        Proyecto open-source para monitoreo oceánico •
        <a
          href="https://github.com/t4t4n32/M_A_N_G_O"
          target="_blank"
        >
          GitHub
        </a>
      </p>
    </div>

  </div>

  <!-- =========================
       JS
       ========================= -->
  <script type="module" src="assets/js/api.service.js"></script>
  <script type="module" src="assets/js/auth.js"></script>

</body>
</html>
