<!-- frontend/login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.A.N.G.O - Acceso al Sistema</title>
  <meta name="description" content="Acceso seguro al sistema M.A.N.G.O">
  
  <!-- Favicon -->
  <link rel="icon" href="image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
  
  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/login.css">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">🌊</div>
      <h1 class="logo-title">M.A.N.G.O</h1>
      <p class="logo-subtitle">
        Monitoreo Autónomo de Niveles y Gestión Oceánica
      </p>
    </div>

    <!-- Card de Login -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Acceso al Sistema</h2>
        <p class="card-subtitle">Ingrese sus credenciales</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Usuario</label>
          <input
            type="text"
            id="username"
            class="form-input"
            placeholder="ej: admin"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            id="toggle-password"
            class="toggle-password"
            aria-label="Mostrar u ocultar contraseña"
          >
            👁️
          </button>
        </div>

        <div class="remember-me">
          <input
            type="checkbox"
            id="remember"
            class="remember-checkbox"
            checked
          />
          <label for="remember" class="remember-label">
            Recordar sesión en este dispositivo
          </label>
        </div>

        <!-- Mensaje de Error -->
        <div id="error-container" style="display:none;">
          <div class="error-message">
            <span>⚠️</span>
            <span id="error-text">
              Credenciales inválidas.
            </span>
          </div>
        </div>

        <!-- Advertencia Offline -->
        <div id="offline-warning" style="display:none;">
          <div class="warning-message">
            <span>🌐</span>
            <span>
              Backend no disponible. Intentando conexión...
            </span>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">
          <span id="btn-text">Ingresar al dashboard</span>
        </button>
      </form>

      <!-- Estado del Sistema -->
      <div class="system-status">
        <div class="status-online" id="status-indicator">
          <span class="status-indicator" id="connection-indicator"></span>
          <span id="connection-status">Verificando conexión...</span>
        </div>
      </div>

      <!-- Enlace a página principal -->
      <div class="back-link">
        <a href="index.html">
          <i class="fas fa-arrow-left"></i> Volver a la página principal
        </a>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>
        Proyecto open-source para monitoreo oceánico •
        <a
          href="https://github.com/T4t4n32/M_A_N_G_O"
          target="_blank"
        >
          GitHub
        </a>
      </p>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
