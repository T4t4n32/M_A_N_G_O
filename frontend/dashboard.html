<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>M.A.N.G.O — Sensor Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0e1a1f;
      color: #eaeaea;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .sensor-card {
      background: #14262d;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      width: 300px;
    }

    .sensor-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .sensor-value {
      font-size: 1.4em;
    }

    .status {
      font-size: 0.85em;
      opacity: 0.8;
    }

    button {
      margin-top: 10px;
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>M.A.N.G.O — Live Sensors</h1>
  <p>Raw data (non-calibrated)</p>

  <!-- pH SENSOR -->
  <div class="sensor-card">
    <div class="sensor-title">pH Sensor</div>
    <div id="ph-value" class="sensor-value">Loading...</div>
    <div id="ph-status" class="status"></div>
    <button disabled>History (soon)</button>
  </div>

  <script>
    const API_BASE = "http://localhost:5000/api";

    function updatePH() {
      fetch(`${API_BASE}/ph/latest`)
        .then(res => res.json())
        .then(data => {
          const valueEl = document.getElementById("ph-value");
          const statusEl = document.getElementById("ph-status");

          if (data.value === null) {
            valueEl.innerText = "No data";
            statusEl.innerText = "Waiting for serial input...";
          } else {
            valueEl.innerText = `${data.value.toFixed(3)} V`;
            statusEl.innerText = `Status: ${data.status}`;
          }
        })
        .catch(() => {
          document.getElementById("ph-value").innerText = "Backend offline";
        });
    }

    setInterval(updatePH, 2000);
    updatePH();
  </script>
</body>
</html>
