<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M.A.N.G.O — Monitoreo Ambiental de Manglares</title>
    <meta name="description" content="Sistema autónomo de monitoreo ambiental en tiempo real para la protección de ecosistemas de manglar. Sensores de pH, temperatura y turbidez." />
    <meta name="author" content="M.A.N.G.O Project" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://mango-project.org" />

    <meta property="og:title" content="M.A.N.G.O — Monitoreo Ambiental de Manglares" />
    <meta property="og:description" content="Sistema institucional de monitoreo ambiental en tiempo real para la protección de manglares y ecosistemas marítimos." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mango-project.org" />
    <meta property="og:locale" content="es_CO" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="M.A.N.G.O — Monitoreo Ambiental" />
    <meta name="twitter:description" content="Tecnología IoT al servicio de la conservación de manglares." />

    <link rel="icon" href="/images/icono.png" type="image/png" />

    <!-- Font preconnect: shaves one full RTT on mobile connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Sans+3:wght@300;400;500;600;700;800&family=Merriweather:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Mobile browser theming -->
    <meta name="theme-color" content="#0d1d2b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      Import map for dynamically-loaded Framer.com code components
      (see src/components/effects/FramerEmbed.tsx). These are fetched at
      runtime as an isolated React island, never bundled by Vite, so their
      bare-specifier imports need to be resolved by the browser itself.
      "framer" has no real npm runtime (the published package is
      TypeScript types only) so it points at our own local shim.
    -->
    <script type="importmap">
      {
        "imports": {
          "framer": "/framer-shim.js",
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
          "framer-motion": "https://esm.sh/framer-motion@12.34.3?deps=react@18.3.1,react-dom@18.3.1",
          "gsap": "https://esm.sh/gsap@3.12.5"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
