<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.A.N.G.O. | Redirigiendo...</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="redirect-container">
        <!-- Logo Animado -->
        <div class="logo-container">
            <div class="mango-logo">
                <span class="m-letter">M</span>
                <span class="separator">.</span>
                <span class="a-letter">A</span>
                <span class="separator">.</span>
                <span class="n-letter">N</span>
                <span class="separator">.</span>
                <span class="g-letter">G</span>
                <span class="separator">.</span>
                <span class="o-letter">O</span>
            </div>
            <div class="logo-subtitle">
                Monitoreo Autónomo de Niveles y Gestión Oceánica
            </div>
        </div>

        <!-- Loading Animation -->
        <div class="loading-section">
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <div class="loading-text">
                <span class="loading-dots">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </span>
                <span class="loading-message">Cargando plataforma...</span>
            </div>
        </div>

        <!-- Redirect Info -->
        <div class="redirect-info">
            <div class="info-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
            </div>
            <div class="info-text">
                <p>Redirigiendo a la plataforma principal de M.A.N.G.O...</p>
                <p class="info-subtext">Plataforma de monitoreo ambiental oceánico</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="redirect-footer">
            <p>© 2026 M.A.N.G.O. | Monitoreo Autónomo de Niveles y Gestión Oceánica</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
